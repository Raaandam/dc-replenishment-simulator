# DC-to-store replenishment and store capacity simulation

data:
  # M5 Forecasting (Kaggle "m5-forecasting-accuracy"): sales_train_evaluation.csv
  sales: data/raw/sales_train_evaluation.csv
  category: FOODS            # M5 category used as the grocery range
  n_skus: 60                 # top-selling items kept
  stores: [CA_1, CA_2, CA_3, CA_4, TX_1, TX_2, TX_3, WI_1]
  history_days: 180          # used to fit demand statistics
  sim_days: 120              # replayed in the simulation
  seed: 7

# Shelf life in days by temperature/category class. M5 has no shelf life, so the
# FOODS departments are mapped to grocery classes in data.py.
shelf_life_days:
  fresh: 3                   # fruit & vegetables
  chilled: 6                 # dairy, eggs
  ambient: 180               # staples, packaged snacks

network:
  supplier_lead_time_days: 2  # supplier -> DC
  dc_to_store_lead_time_h: 6  # dispatch -> store receipt
  dc_dock_doors: 2            # outbound loading docks
  load_time_h: 0.75           # per truck at a dock
  trucks_per_store_per_day: 1
  truck_capacity_units: 1500
  dispatch_hour: 2            # trucks leave from 02:00 so stock lands before the morning peak

policies:
  # Store-level policies compared in the simulation
  - name: s_S                 # continuous review on inventory position, order up to S
  - name: min_max             # review on on-hand only, order up to max in whole cases
    case_pack: 6
  - name: periodic            # review every R days, order up to S
    review_days: 2
  - name: fixed_qty           # baseline: fixed order quantity at a fixed reorder point
    days_of_cover: 3

# Target cycle service level by ABC-XYZ class (z-score is derived from it)
service_level:
  AX: 0.98
  AY: 0.97
  AZ: 0.95
  BX: 0.96
  BY: 0.95
  BZ: 0.93
  CX: 0.93
  CY: 0.92
  CZ: 0.90

order_up_to_days:            # S = reorder point + this many days of mean demand
  fresh: 1
  chilled: 2
  ambient: 5

throughput:
  # Hourly order arrivals for one dark store (orders/hour), 06:00-24:00
  hourly_orders: [20, 45, 70, 60, 45, 40, 45, 40, 35, 40, 55, 80, 95, 90, 70, 50, 35, 20]
  peak_multiplier: 1.6        # festival / weekend peak day
  pick_time_min: 2.5          # mean minutes per order
  pack_time_min: 1.0
  task_time_shape: 4          # gamma shape; CV = 0.5. Calibrate from a time study
  pack_stations: 3
  sla_min: 10                 # order must be picked and packed within this
  sla_target: 0.95            # share of orders meeting the SLA
  pickers_range: [2, 16]
